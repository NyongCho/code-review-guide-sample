{
  "name": "API runtime isolation canary",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.ref == 'refs/heads/acceptance/probe-fixed-tool-root'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "persist-credentials": false
          }
        },
        {
          "run": "mkdir -p /home/runner/review-node-cache\necho /home/runner/review-tools/bin >> \"$GITHUB_PATH\""
        },
        {
          "uses": "actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f",
          "with": {
            "node-version": "${{ matrix.node }}",
            "package-manager-cache": false
          },
          "env": {
            "RUNNER_TOOL_CACHE": "/home/runner/review-node-cache"
          }
        },
        {
          "name": "Install pinned official tools without model call",
          "uses": "openai/codex-action@13e9c17417b29e9a276f73ec6ed7fb574137d3c3",
          "with": {
            "codex-version": "0.169.0"
          },
          "env": {
            "RUNNER_TOOL_CACHE": "/home/runner/review-node-cache"
          }
        },
        {
          "env": {
            "EXPECTED_NODE": "${{ matrix.node }}"
          },
          "run": "test \"$(node -p process.versions.node)\" = \"$EXPECTED_NODE\"\ntest \"$(npm root -g)\" = /home/runner/review-tools/lib/node_modules\ntest \"$(command -v codex)\" = /home/runner/review-tools/bin/codex\ntest \"$(command -v codex-responses-api-proxy)\" = /home/runner/review-tools/bin/codex-responses-api-proxy"
        },
        {
          "run": "python3 probes/runtime_probe.py prepare"
        },
        {
          "name": "Initialize official proxy and remove privileges using fake key",
          "uses": "openai/codex-action@13e9c17417b29e9a276f73ec6ed7fb574137d3c3",
          "with": {
            "codex-version": "0.169.0",
            "codex-home": "/home/runner/review-home",
            "openai-api-key": "synthetic-not-a-real-key",
            "safety-strategy": "drop-sudo",
            "permission-profile": "review"
          },
          "env": {
            "RUNNER_TOOL_CACHE": "/home/runner/review-node-cache"
          }
        },
        {
          "run": "python3 probes/runtime_probe.py check"
        },
        {
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "api-isolation-${{ matrix.node }}",
            "path": "probe-evidence/",
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "24.22.2",
            "24.22.3"
          ]
        }
      },
      "env": {
        "NPM_CONFIG_PREFIX": "/home/runner/review-tools"
      }
    }
  }
}
