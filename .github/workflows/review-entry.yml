        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name inspect_0 --destination input",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name self_hosted_0 --destination worker-output",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "if": "${{ needs.self_hosted_0.result == 'success' }}"
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name api_0 --destination worker-output",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
