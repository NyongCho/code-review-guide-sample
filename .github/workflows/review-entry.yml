{
  "name": "Project AI review",
  "on": {
    "pull_request_target": {
      "types": [
        "opened",
        "synchronize",
        "reopened",
        "edited",
        "ready_for_review"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "review-${{ github.event.pull_request.number }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "entry": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "environment": "review-publisher",
      "outputs": {
        "role": "${{ steps.control.outputs.role }}",
        "phase": "${{ steps.control.outputs.phase }}",
        "head": "${{ steps.control.outputs.head }}",
        "mode": "${{ steps.control.outputs.mode }}",
        "terminal": "${{ steps.control.outputs.terminal }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "id": "publisher-token",
          "uses": "actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349",
          "with": {
            "app-id": "${{ vars.REVIEW_APP_ID }}",
            "private-key": "${{ secrets.REVIEW_APP_PRIVATE_KEY }}",
            "permission-checks": "write",
            "permission-contents": "read",
            "permission-administration": "read"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci entry",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "REVIEW_CHECK_TOKEN": "${{ steps.publisher-token.outputs.token }}"
          },
          "id": "control"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ github.run_id }}-${{ github.run_attempt }}-entry",
            "path": "out",
            "retention-days": 14,
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "tests_0": {
      "needs": [
        "entry"
      ],
      "if": "${{ !cancelled() && needs.entry.result == 'success' && needs.entry.outputs.terminal != 'true' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name entry --destination input",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci tests"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ github.run_id }}-${{ github.run_attempt }}-tests_0",
            "path": "test-result.json",
            "retention-days": 14,
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "inspect_0": {
      "needs": [
        "entry",
        "tests_0"
      ],
      "if": "${{ always() && !cancelled() && needs.entry.result == 'success' && needs.entry.outputs.terminal != 'true' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "outputs": {
        "role": "${{ steps.control.outputs.role }}",
        "phase": "${{ steps.control.outputs.phase }}",
        "head": "${{ steps.control.outputs.head }}",
        "mode": "${{ steps.control.outputs.mode }}",
        "terminal": "${{ steps.control.outputs.terminal }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name entry --destination input",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name tests_0 --destination test-output",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "if": "${{ needs.tests_0.result == 'success' }}"
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci inspect",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "TEST_OUTCOME": "${{ needs.tests_0.result }}"
          },
          "id": "control"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ github.run_id }}-${{ github.run_attempt }}-inspect_0",
            "path": "out",
            "retention-days": 14,
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "self_hosted_0": {
      "needs": [
        "inspect_0"
      ],
      "if": "${{ !cancelled() && needs.inspect_0.outputs.mode == 'self_hosted' && needs.inspect_0.outputs.role != '' }}",
      "runs-on": "ubuntu-24.04",
      "environment": "review-runtime",
      "timeout-minutes": 3,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name inspect_0 --destination input",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci ssh-worker",
          "env": {
            "REVIEW_SSH_KEY": "${{ secrets.REVIEW_SSH_KEY }}",
            "REVIEW_SSH_HOST": "${{ vars.REVIEW_SSH_HOST }}",
            "REVIEW_SSH_USER": "${{ vars.REVIEW_SSH_USER }}",
            "REVIEW_SSH_PORT": "${{ vars.REVIEW_SSH_PORT }}",
            "REVIEW_SSH_KNOWN_HOSTS": "${{ vars.REVIEW_SSH_KNOWN_HOSTS }}"
          },
          "id": "prepare"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ github.run_id }}-${{ github.run_attempt }}-self_hosted_0",
            "path": "model-result.json",
            "retention-days": 14,
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "api_0": {
      "needs": [
        "inspect_0"
      ],
      "if": "${{ !cancelled() && needs.inspect_0.outputs.mode == 'api' && needs.inspect_0.outputs.role != '' }}",
      "runs-on": "ubuntu-24.04",
      "environment": "review-runtime",
      "timeout-minutes": 3,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci fetch-artifact --name inspect_0 --destination input",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci prepare-worker",
          "id": "prepare"
        },
        {
          "name": "Call Codex",
          "id": "codex",
          "uses": "openai/codex-action@13e9c17417b29e9a276f73ec6ed7fb574137d3c3",
          "timeout-minutes": "${{ fromJSON(steps.prepare.outputs.timeout_minutes) }}",
          "continue-on-error": true,
          "with": {
            "openai-api-key": "${{ secrets.OPENAI_API_KEY }}",
            "prompt-file": "request/prompt.md",
            "output-file": "raw-result.json",
            "output-schema-file": "/home/runner/review-input/policy/.review/schemas/model-output.schema.json",
            "working-directory": "/home/runner/review-input",
            "codex-home": "/home/runner/review-home",
            "permission-profile": "review",
            "safety-strategy": "drop-sudo",
            "codex-version": "${{ steps.prepare.outputs.codex_version }}",
            "model": "${{ steps.prepare.outputs.model }}",
            "effort": "${{ steps.prepare.outputs.effort }}",
            "codex-args": "[\"--json\", \"--ephemeral\"]"
          }
        },
        {
          "run": "python3 trusted/.review/bin/reviewctl.py ci normalize-worker",
          "env": {
            "ACTION_OUTCOME": "${{ steps.codex.outcome }}"
          },
          "if": "${{ always() && !cancelled() }}"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ github.run_id }}-${{ github.run_attempt }}-api_0",
            "path": "model-result.json",
            "retention-days": 14,
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
