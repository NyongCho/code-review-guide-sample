          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SELF_HOSTED_OUTCOME": "${{ needs.self_hosted_0.result }}",
            "API_OUTCOME": "${{ needs.api_0.result }}"
          },
          "id": "control"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ github.run_id }}-${{ github.run_attempt }}-collect_0",
            "path": "out",
            "retention-days": 14,
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "tests_1": {
