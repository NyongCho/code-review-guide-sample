{
  "name": "Untrusted new workflow canary",
  "on": {
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {},
  "jobs": {
    "ci": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "run": "exit 1",
          "name": "Intentional failure to verify required-check enforcement"
        }
      ]
    },
    "protected": {
      "runs-on": "ubuntu-24.04",
      "environment": "review-runtime",
      "steps": [
        {
          "env": {
            "CANARY": "${{ secrets.REVIEW_BOUNDARY_CANARY }}"
          },
          "run": "test \"$CANARY\" = \"synthetic-canary-no-secret\""
        }
      ]
    }
  }
}
