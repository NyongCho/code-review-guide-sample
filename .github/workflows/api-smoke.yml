{
  "name": "One-call API connection smoke",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "api-acceptance-smoke",
    "cancel-in-progress": false
  },
  "jobs": {
    "smoke": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "environment": "review-runtime",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Select the verified Codex install root",
          "run": "echo /home/runner/review-tools/bin >> \"$GITHUB_PATH\""
        },
        {
          "uses": "openai/codex-action@13e9c17417b29e9a276f73ec6ed7fb574137d3c3",
          "with": {
            "codex-version": "0.169.0"
          }
        },
        {
          "run": "python3 probes/api_smoke.py prepare"
        },
        {
          "name": "One short billable call",
          "uses": "openai/codex-action@13e9c17417b29e9a276f73ec6ed7fb574137d3c3",
          "timeout-minutes": 1,
          "with": {
            "openai-api-key": "${{ secrets.OPENAI_API_KEY }}",
            "codex-version": "0.169.0",
            "codex-home": "/home/runner/review-home",
            "permission-profile": "review",
            "safety-strategy": "drop-sudo",
            "model": "gpt-6-luna",
            "effort": "low",
            "working-directory": "/home/runner/review-input",
            "prompt": "Return exactly {\"ok\": true}. Do not call tools.",
            "output-schema-file": "/home/runner/review-input/smoke.schema.json",
            "output-file": "${{ github.workspace }}/smoke-result.json",
            "codex-args": "[\"--json\", \"--ephemeral\"]"
          }
        },
        {
          "run": "python3 probes/api_smoke.py check"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "api-smoke-result",
            "path": "smoke-result.json",
            "retention-days": 14
          }
        }
      ],
      "env": {
        "NPM_CONFIG_PREFIX": "/home/runner/review-tools"
      }
    }
  }
}
